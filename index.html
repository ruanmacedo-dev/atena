<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atena</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
<main>
    <header>
        <h1>Cortador de <span>Clipes</span></h1>
        <p class="subtitulo">Corte o melhor momento e deixe no tamanho certo.</p>
    </header>

    <div class="linha">
        <input type="file" id="escolher" accept="video/*">
        <label for="escolher" class="botao">Escolher vídeo</label>
        <p id="info"></p>
    </div>

    <video id="video" controls></video>

    <section class="cartao">
        <div class="linha">
            <button id="marcarInicio">Marcar início</button>
            <button id="marcarFim">Marcar fim</button>
        </div>
        <div class="trilha" id="trilha">
            <div class="trecho" id="trecho" hidden></div>
            <div class="agulha" id="agulha" hidden></div>
        </div>
        <div class="tempos">
            <span>0:00</span>
            <span id="total"></span>
        </div>
        <div class="placas">
            <div class="placa">
                <span class="rotulo">Início</span>
                <strong id="valorInicio">–</strong>
            </div>
            <div class="placa">
                <span class="rotulo">Fim</span>
                <strong id="valorFim">–</strong>
            </div>
            <div class="placa">
                <span class="rotulo">Corte</span>
                <strong id="valorCorte">–</strong>
            </div>
            <div class="placa" id="placaQualidade">
                <span class="rotulo">Qualidade</span>
                <div class="valor-e-barras">
                    <strong id="qualidade">–</strong>
                    <span class="barrinhas" id="barrinhas"><i></i><i></i><i></i><i></i></span>
                </div>
            </div>
        </div>
        <p id="alerta"></p>
    </section>

    <section class="cartao">
        <div class="linha">
            <label class="campo">Limite (MB) <input type="number" id="limite" value="20" min="1"></label>
            <button id="comprimir" class="principal">Cortar e comprimir</button>
        </div>
        <label class="opcao"><input type="checkbox" id="compativel"> Compatível com iPhone antigo (qualidade menor)</label>
        <progress id="progresso" value="0" max="1" hidden></progress>
        <p id="aviso"></p>
        <a id="baixar" hidden>Baixar o clipe</a>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
