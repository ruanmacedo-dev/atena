<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atena</title>
    <style>
        :root {
            color-scheme: dark;
            --fundo: #26292e;
            --cartao: #202328;
            --botao: #2f343a;
            --borda: #3f454d;
            --texto: #eceff4;
            --texto-apagado: #a1a9b1;
            --rosa: #ff6376;
            --rosa-claro: #ff8494;
            --verde: #a6e3a1;
            --letra-escura: #1f2226;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--fundo);
            color: var(--texto);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
            line-height: 1.5;
        }

        ::selection {
            background: var(--rosa);
            color: var(--letra-escura);
        }

        main {
            max-width: 820px;
            margin: 0 auto;
            padding: 48px 16px 64px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        h1 span {
            color: var(--rosa);
        }

        p {
            margin: 0;
        }

        .subtitulo {
            margin-top: 6px;
            color: var(--texto-apagado);
        }

        p:empty {
            display: none;
        }

        [hidden] {
            display: none !important;
        }

        .linha {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 10px;
        }

        .cartao {
            background: var(--cartao);
            border: 1px solid var(--borda);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .extras {
            margin-left: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #16181b;
            border: 1px solid var(--borda);
            border-radius: 14px;
        }

        button,
        .botao {
            font: inherit;
            font-size: 0.95rem;
            padding: 9px 16px;
            border: 1px solid var(--borda);
            border-radius: 10px;
            background: var(--botao);
            color: var(--texto);
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
        }

        button:hover,
        .botao:hover {
            border-color: var(--rosa);
        }

        button:active,
        .botao:active {
            transform: translateY(1px);
        }

        button:focus-visible,
        #escolher:focus-visible + .botao {
            outline: 2px solid var(--rosa);
            outline-offset: 2px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: progress;
        }

        .principal {
            background: var(--rosa);
            border-color: var(--rosa);
            color: var(--letra-escura);
            font-weight: 600;
        }

        .principal:hover {
            background: var(--rosa-claro);
            border-color: var(--rosa-claro);
        }

        .discreto {
            background: transparent;
            border-color: transparent;
            color: var(--texto-apagado);
            padding: 9px 10px;
        }

        .discreto:hover {
            background: var(--botao);
            border-color: transparent;
            color: var(--texto);
        }

        #escolher {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .campo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--texto-apagado);
        }

        input[type="number"] {
            font: inherit;
            width: 80px;
            padding: 8px 10px;
            border: 1px solid var(--borda);
            border-radius: 10px;
            background: var(--fundo);
            color: var(--texto);
        }

        .opcao {
            display: flex;
            align-items: center;
            gap: 8px;
            align-self: flex-start;
            color: var(--texto-apagado);
            font-size: 0.95rem;
            cursor: pointer;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: var(--rosa);
            cursor: pointer;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--rosa);
        }

        #info,
        #resultado,
        #aviso {
            color: var(--texto-apagado);
            font-size: 0.95rem;
        }

        #qualidade {
            color: var(--rosa);
            font-weight: 600;
        }

        progress {
            appearance: none;
            -webkit-appearance: none;
            display: block;
            width: 100%;
            height: 8px;
            border: none;
            border-radius: 999px;
            overflow: hidden;
            background: var(--botao);
        }

        progress::-webkit-progress-bar {
            background: var(--botao);
        }

        progress::-webkit-progress-value {
            background: var(--rosa);
            transition: width 0.2s;
        }

        progress::-moz-progress-bar {
            background: var(--rosa);
        }

        #baixar {
            align-self: flex-start;
            padding: 10px 18px;
            border-radius: 10px;
            background: var(--verde);
            color: var(--letra-escura);
            font-weight: 600;
            text-decoration: none;
        }

        #baixar:hover {
            filter: brightness(1.08);
        }
    </style>
</head>
<body>
<main>
    <header>
        <h1>Cortador de <span>Clipes</span></h1>
        <p class="subtitulo">Corte o melhor momento e deixe no tamanho certo.</p>
    </header>

    <div class="linha">
        <input type="file" id="escolher" accept="video/*">
        <label for="escolher" class="botao">Escolher vídeo</label>
        <p id="info"></p>
    </div>

    <video id="video" controls></video>

    <section class="cartao">
        <div class="linha">
            <button id="marcarInicio">Marcar início</button>
            <button id="marcarFim">Marcar fim</button>
            <div class="extras">
                <button id="botao" class="discreto">Em que segundo estou?</button>
                <button id="botao2" class="discreto">Duração do vídeo</button>
            </div>
        </div>
        <p id="resultado"></p>
        <p id="corte"></p>
        <p id="qualidade"></p>
    </section>

    <section class="cartao">
        <div class="linha">
            <label class="campo">Limite (MB) <input type="number" id="limite" value="20" min="1"></label>
            <button id="comprimir" class="principal">Cortar e comprimir</button>
        </div>
        <label class="opcao"><input type="checkbox" id="compativel"> Compatível com iPhone antigo (qualidade menor)</label>
        <progress id="progresso" value="0" max="1" hidden></progress>
        <p id="aviso"></p>
        <a id="baixar" hidden>Baixar o clipe</a>
    </section>
</main>

<script>
    const video = document.getElementById("video");
    const botao = document.getElementById("botao");
    const botao2 = document.getElementById("botao2");
    const resultado = document.getElementById("resultado");
    const escolher = document.getElementById("escolher");
    const info = document.getElementById("info");
    const marcarInicio = document.getElementById("marcarInicio");
    const marcarFim = document.getElementById("marcarFim");
    const corte = document.getElementById("corte");
    const qualidade = document.getElementById("qualidade");
    const limite = document.getElementById("limite");
    const comprimir = document.getElementById("comprimir");
    const progresso = document.getElementById("progresso");
    const aviso = document.getElementById("aviso");
    const baixar = document.getElementById("baixar");
    const compativel = document.getElementById("compativel");

    let inicio = 0;
    let fim = 0;
    let arquivo = null;

    const ENDERECO_DA_BIBLIOTECA = "https://cdn.jsdelivr.net/npm/mediabunny@1.65.2/dist/bundles/mediabunny.min.mjs";

    botao.addEventListener("click", function () {
        resultado.textContent = "Você está no segundo " + Math.trunc(video.currentTime);
    });

    botao2.addEventListener("click", function () {
        if (video.src === "") {
            resultado.textContent = "Escolha um vídeo primeiro";
        } else {
            resultado.textContent = "O clipe tem " + Math.trunc(video.duration) + " segundos";
        }
    });

    escolher.addEventListener("change", function () {
        if (escolher.files.length === 0) {
            return;
        }
        arquivo = escolher.files[0];
        video.src = URL.createObjectURL(arquivo);
        info.textContent = arquivo.name + " - " + Math.trunc(arquivo.size / 1024 / 1024) + " MB";
        inicio = 0;
        fim = 0;
        corte.textContent = "";
        qualidade.textContent = "";
        aviso.textContent = "";
        baixar.hidden = true;
    });

    marcarInicio.addEventListener("click", function () {
        inicio = Math.trunc(video.currentTime);
        corte.textContent = "Início: " + inicio + " s";
        qualidade.textContent = "";
    });

    marcarFim.addEventListener("click", function () {
        fim = Math.trunc(video.currentTime);
        if (fim <= inicio) {
            corte.textContent = "O fim precisa vir depois do início";
            qualidade.textContent = "";
        } else {
            corte.textContent = "Início: " + inicio + " s - Fim: " + fim + " s - corte de " + (fim - inicio) + " s";
            qualidade.textContent = previsao();
        }
    });

    limite.addEventListener("input", function () {
        if (arquivo !== null && fim > inicio) {
            qualidade.textContent = previsao();
        }
    });

    compativel.addEventListener("change", function () {
        if (arquivo !== null && fim > inicio) {
            qualidade.textContent = previsao();
        }
    });

    function limiteEmBytes() {
        return Number(limite.value) * 1000 * 1000;
    }

    function pesoOriginalDoCorte() {
        return arquivo.size / video.duration * (fim - inicio);
    }

    function cabeSemComprimir() {
        return pesoOriginalDoCorte() <= limiteEmBytes() * 0.9;
    }

    function escolherAltura(mesada) {
        if (mesada >= 1) {
            return 1080;
        } else if (mesada >= 0.5) {
            return 720;
        } else if (mesada >= 0.25) {
            return 480;
        } else {
            return 360;
        }
    }

    function codecDesejado() {
        if (compativel.checked) {
            return "avc";
        }
        return "av1";
    }

    function mesadaDaEscada(codec) {
        const mesada = Number(limite.value) / (fim - inicio);
        if (codec === "av1") {
            return mesada * 2;
        }
        return mesada;
    }

    function previsao() {
        if (cabeSemComprimir()) {
            return "Cabe sem comprimir: vai sair com a qualidade original";
        }
        return "Vai sair em " + escolherAltura(mesadaDaEscada(codecDesejado())) + "p";
    }

    comprimir.addEventListener("click", async function () {
        if (arquivo === null) {
            aviso.textContent = "Escolha um vídeo primeiro";
            return;
        }
        if (fim <= inicio) {
            aviso.textContent = "Marque o início e o fim primeiro";
            return;
        }
        if (!(Number(limite.value) > 0)) {
            aviso.textContent = "Escreva um limite maior que zero";
            return;
        }

        comprimir.disabled = true;
        baixar.hidden = true;
        progresso.value = 0;
        progresso.hidden = false;

        try {
            const pronto = await cortarEComprimir();
            const clipe = new Blob([pronto.dados], { type: "video/mp4" });
            const nomeSemExtensao = arquivo.name.replace(/\.[^.]+$/, "");
            let texto = pronto.texto;
            if (pronto.semSom) {
                texto = texto + ", sem som";
            }
            baixar.href = URL.createObjectURL(clipe);
            baixar.download = nomeSemExtensao + "-cortado.mp4";
            baixar.textContent = "Baixar o clipe (" + (clipe.size / 1024 / 1024).toFixed(1) + " MB, " + texto + ")";
            baixar.hidden = false;
            aviso.textContent = "Pronto!";
        } catch (erro) {
            aviso.textContent = "Deu erro: " + erro.message;
            console.error(erro);
        }

        comprimir.disabled = false;
        progresso.hidden = true;
    });

    async function cortarEComprimir() {
        const mb = await import(ENDERECO_DA_BIBLIOTECA);
        const duracao = fim - inicio;
        const alvo = limiteEmBytes() * 0.95;

        if (cabeSemComprimir()) {
            aviso.textContent = "Cortando sem mexer na qualidade...";
            const copia = await converter(mb, null);
            if (copia !== null && copia.dados.byteLength <= alvo) {
                return { dados: copia.dados, texto: "qualidade original", semSom: false };
            }
        }

        if (typeof VideoEncoder === "undefined") {
            throw new Error("este navegador não consegue comprimir vídeo. Use o Chrome ou o Edge atualizados.");
        }
        let codec = codecDesejado();
        if (codec === "av1" && !(await mb.canEncodeVideo("av1"))) {
            codec = "avc";
        }
        if (!(await mb.canEncodeVideo(codec))) {
            throw new Error("este navegador não consegue comprimir vídeo. Use o Chrome ou o Edge atualizados.");
        }
        let nomeDoCodec = "AV1";
        if (codec === "avc") {
            nomeDoCodec = "H.264";
        }

        const altura = escolherAltura(mesadaDaEscada(codec));
        let bitsPorSegundo = alvo * 8 / duracao - 192000;

        let melhor = null;
        for (let tentativa = 1; tentativa <= 4; tentativa++) {
            if (bitsPorSegundo < 150000) {
                break;
            }
            aviso.textContent = "Comprimindo em " + altura + "p " + nomeDoCodec + " (tentativa " + tentativa + " de 4)...";
            const feito = await converter(mb, { codec: codec, altura: altura, bitsPorSegundo: bitsPorSegundo });
            const tamanho = feito.dados.byteLength;
            if (tamanho <= alvo) {
                if (melhor === null || tamanho > melhor.dados.byteLength) {
                    melhor = feito;
                }
                if (tamanho >= alvo * 0.85) {
                    break;
                }
            }
            bitsPorSegundo = bitsPorSegundo * (alvo / tamanho) * 0.97;
        }
        if (melhor === null) {
            throw new Error("não consegui deixar o clipe abaixo do limite. Faça um corte menor.");
        }
        return { dados: melhor.dados, texto: altura + "p " + nomeDoCodec, semSom: melhor.semSom };
    }

    async function converter(mb, config) {
        const entrada = new mb.Input({ source: new mb.BlobSource(arquivo), formats: mb.ALL_FORMATS });
        const saida = new mb.Output({
            format: new mb.Mp4OutputFormat({ fastStart: "in-memory" }),
            target: new mb.BufferTarget(),
        });
        const opcoes = {
            input: entrada,
            output: saida,
            tracks: "primary",
            trim: { start: inicio, end: fim },
            showWarnings: false,
        };

        if (config === null) {
            opcoes.copy = { mode: "forced", boundaryTolerance: 3 };
        } else {
            opcoes.video = async function (faixa) {
                const largura = faixa.displayWidth;
                const alturaOriginal = faixa.displayHeight;
                const deitado = largura >= alturaOriginal;
                const ladoMenor = deitado ? alturaOriginal : largura;
                const escolha = {
                    codec: config.codec,
                    forceTranscode: true,
                };
                if (ladoMenor > config.altura) {
                    const fator = config.altura / ladoMenor;
                    escolha.width = Math.round(largura * fator / 2) * 2;
                    escolha.height = Math.round(alturaOriginal * fator / 2) * 2;
                    escolha.fit = "fill";
                }
                const estatisticas = await faixa.computePacketStats(120);
                let quadros = Math.min(Math.max(estatisticas.averagePacketRate, 10), 240);
                if (config.altura <= 480 && quadros > 31) {
                    escolha.frameRate = 30;
                    quadros = 30;
                }
                const corrigida = config.bitsPorSegundo * 30 / quadros;
                escolha.quality = new mb.Quality({ bitrate: Math.round(corrigida) });
                return escolha;
            };
        }

        const conversao = await mb.Conversion.init(opcoes);
        const perdeuImagem = conversao.discardedTracks.some(function (d) { return d.track.isVideoTrack(); });
        const perdeuSom = conversao.discardedTracks.some(function (d) { return d.track.isAudioTrack(); });
        if (config === null && (!conversao.isValid || conversao.discardedTracks.length > 0)) {
            return null;
        }
        if (!conversao.isValid || perdeuImagem) {
            throw new Error("não consegui ler a imagem deste vídeo.");
        }
        conversao.onProgress = function (parte) {
            progresso.value = parte;
        };
        await conversao.execute();
        return { dados: saida.target.buffer, semSom: perdeuSom };
    }
</script>
</body>
</html>
